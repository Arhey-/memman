<head>
	<meta content="width=device-width, initial-scale=1" name="viewport">
	<meta name="color-scheme" content="dark light">
	<style>
		:root {
			--repeat: auto-fit;
		}

		body {
			color: #ccc;
			background-color: #333;
			margin: 0;
		}

		p {
			word-wrap: break-word;
		}

		#cards {
			--card-max-width: 1fr;
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(320px, var(--card-max-width)));

			@media (orientation: landscape) {
				& {
					--card-max-width: .5fr;
				}
			}
		}

		#cards>.div {
			grid-column: 1/-1;
		}

		a,
		#cards>img {
			position: relative;
		}

		#cards>img {
			max-width: 100%;
		}

		.fade {
			opacity: 0.7;
		}

		a>p {
			color: white;
			background-color: rgba(0, 0, 0, 0.3);
			margin: 5px;
			position: absolute;
			font-size: calc(1rem / var(--repeat));
		}

		.local-only .name {
			border-bottom: 1px solid red;
		}
		.diff.remote .name {
			border-bottom: 1px solid dodgerblue;
		}

		.tags {
			bottom: 0;
			right: 0;
			display: flex;
			gap: .5rem;
		}

		.card {
			container: card / inline-size;

			&>img {
				width: 100%;
				min-height: 25cwq;
				/* aspect-ratio: 16 / 9; */
			}
		}

		a.next {
			border: 1px solid green;
		}

		a.next.gap {
			border-style: dashed;
		}

		a.select {
			border: 1px solid blue;
		}

		#notifications {
			position: absolute;
			top: 0;
			width: 100%;
			max-height: 15vh;
			overflow-y: scroll;
			background: linear-gradient(black, black 50%, #000b);
		}

		#tool {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
			gap: 1px;
			position: sticky;
			bottom: 0;

			progress.wide {
				grid-column: 1/-1;
				width: 100%;
			}
		}

		button {
			font-size: 1rem;
		}

		#tagsInc, .bgGreen {
			background-color: #385539;
		}

		#tagsEx, .bgRed {
			background-color: #5b0f0f;
		}

		textarea {
			grid-column: 1/-1;
		}

		textarea:focus {
			height: 12em;
		}

		body:not(:has(#cards > *)) #tool textarea {
			height: 12em;
		}

		#tags {
			label {
				padding: 0 0.25rem;
				display: inline-block;
			}

			label>input[type=checkbox] {
				display: none;
			}

			label:has(.inc) {
				color: mediumseagreen;
			}
			label:has(.ex) {
				color: red;
			}
		}

		#actions {
			gap: 1px;
			&[open] { display: grid; }
		}

		.edit-card-section {
			display: flex ;
			justify-content: center;
			gap: 1rem;
		}

		.red {
			color: red;
		}
		.green {
			color: mediumseagreen;
		}

		.log {
			border-bottom: 1px dashed gray;
		}
	</style>
</head>

<main id="cards"></main>
<footer id="tool">
	<textarea placeholder="eval" hidden autocorrect="off" autocapitalize="off">
//prevent eval -- uncomment to don't eval
// duplicates('ga=','exclude')
// [...$$('a.select')].forEach(a => log(a.href))
// pull(localStorage.getItem('tempItems'), [])
// localStorage.setItem('links-tag', 'a,b')
</textarea>
	<button id="code">code</button>
	<input id="perRow" type='number' placeholder='auto-fit' />
	<button id="top">top</button>
	<button id="down">down</button>
	<button id="view">view</button>
	<label><input type="checkbox" id="prev">prev</label>
	<label><input type="checkbox" id="select">select</label>
	<select id="tagsEx" multiple></select>
	<select id="tagsInc" multiple></select>
	<button id="show">show</button>
</footer>
<fieldset id="tags">
	<legend>tags</legend>
</fieldset>
<dialog id="actions">
	<button onclick="this.closest('dialog').close()">close</button>
</dialog>
<header id="notifications"></header>

<script type="module" src="./links.js"></script>
