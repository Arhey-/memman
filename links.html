<head>
	<meta content="width=device-width, initial-scale=1" name="viewport">
	<meta name="color-scheme" content="dark light">
	<style>
		:root {
			--repeat: auto-fit;
		}

		body {
			color: #ccc;
			background-color: #333;
			margin: 0;
		}

		p {
			word-wrap: break-word;
		}

		#cards {
			--card-max-width: 1fr;
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(320px, var(--card-max-width)));

			@media (orientation: landscape) {
				& {
					--card-max-width: .5fr;
				}
			}
		}

		#cards>.div {
			grid-column: 1/-1;
		}

		a,
		#cards>img {
			position: relative;
		}

		#cards>img {
			max-width: 100%;
		}

		a>p {
			color: white;
			background-color: rgba(0, 0, 0, 0.3);
			margin: 5px;
			position: absolute;
			font-size: calc(1rem / var(--repeat));
		}

		.tags {
			bottom: 0;
			right: 0;
		}

		a>img {
			width: 100%;
			aspect-ratio: 16 / 9;
		}

		a.next {
			border: 1px solid green;
		}

		a.next.gap {
			border-style: dashed;
		}

		a.select {
			border: 1px solid blue;
		}

		#tool {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
			gap: 1px;
			position: sticky;
			bottom: 0;
		}

		button {
			font-size: 1rem;
		}

		#tagsInc {
			background-color: #385539;
		}

		#tagsEx {
			background-color: #5b0f0f;
		}

		textarea {
			grid-column: 1/-1;
		}

		textarea:focus {
			height: 12em;
		}

		body:not(:has(#cards > *)) #tool textarea {
			height: 12em;
		}

		#tags {
			label {
				padding: 0 0.25rem;
				display: inline-block;
			}

			label>input[type=checkbox] {
				display: none;
			}

			label:has(:checked) {
				color: darkseagreen;
			}
		}
	</style>
</head>

<div id="cards"></div>
<div id="tool">
	<textarea placeholder="eval" hidden>

// upload()

</textarea>
	<button id="code">code</button>
	<input id="perRow" type='number' placeholder='auto-fit' />
	<button id="top">top</button>
	<button id="down">down</button>
	<button id="view">view</button>
	<label><input type="checkbox" id="prev">prev</label>
	<label><input type="checkbox" id="select">select</label>
	<select id="tagsEx" multiple></select>
	<select id="tagsInc" multiple></select>
